[package]
name = "noadyt-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.7", features = ["protocol-asset"] }
tauri-plugin-libmpv = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
